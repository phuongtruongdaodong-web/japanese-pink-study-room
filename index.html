function lessonQuizOptions(k,j){let words=minnaVocab[k];if(j<5){let wi=[0,2,4,6,8][j],w=words[wi],opts=[w[3],words[(wi+1)%words.length][3],words[(wi+3)%words.length][3],words[(wi+5)%words.length][3]];let shift=(k+j)%4;return opts.slice(shift).concat(opts.slice(0,shift));}let correct=minnaLessons[k][6],opts=[correct,'N1 は N2 です。','Vてください。','Vたことがあります。'].filter((x,i,a)=>a.indexOf(x)===i);while(opts.length<4)opts.push('N を Vます。');let shift=(k+2)%opts.length;return opts.slice(shift).concat(opts.slice(0,shift));}
function renderLessonQuiz(k){return Array.from({length:6},(_,j)=>{let opts=lessonQuizOptions(k,j),prompt;if(j<5){let wi=[0,2,4,6,8][j],w=minnaVocab[k][wi];prompt=esc(w[0])+'（'+esc(w[1])+'）có nghĩa là gì?';}else{prompt='Công thức nào đúng với trọng tâm ngữ pháp của bài này?';}return '<div class="quizitem"><b>Câu '+(j+1)+'. '+prompt+'</b><div class="reviewtools">'+opts.map((o,i)=>btn(String.fromCharCode(65+i)+'. '+esc(o),'lessonanswer',k+':'+j+':'+i,'btn')).join('')+'</div><p id="lesson-qfb-'+j+'" class="small muted"></p></div>'}).join('')+ '<p class="small muted">6 câu · 5 câu từ vựng và 1 câu ngữ pháp. Mỗi câu có phản hồi và giải thích ngay sau khi chọn.</p>'};

function kanaPage(){let a=script==='hiragana'?kana:katakana;return head('Bảng chữ cái Nhật Bản','Bấm vào chữ để nghe. Romaji là gợi ý, hãy tập nhận diện chữ Nhật.')+card('<div class="row">'+btn('Hiragana','script','hiragana',script==='hiragana'?'btn primary':'btn')+btn('Katakana','script','katakana',script==='katakana'?'btn primary':'btn')+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(72px,1fr));margin-top:14px">'+a.map(x=>btn('<span class="jp">'+x[0]+'</span><br><small>'+x[1]+'</small>','say',x[0],'tile')).join('')+'</div>')+card('<b>Phát âm cần nhớ</b><p>Âm っ nhỏ tạo khoảng ngắt; nguyên âm dài cần kéo dài đúng nhịp. Các âm し (shi), ち (chi), つ (tsu), ふ (fu) không nên đọc theo kiểu ghép chữ tiếng Việt.</p>')};
function wordlist(arr){return arr.map(w=>'<div class="word"><div class="grow"><div class="jp">'+esc(w[0])+'</div><div>'+esc(w[1])+' <span class="roma">'+(showRomaji?'· '+esc(w[2]):'')+'</span></div><div class="small">'+esc(w[3])+'</div></div>'+btn('🔊','say',w[1])+'</div>').join('')};
function vocab(){return head('Từ vựng số đếm, đời sống & Minna','Chọn từng bài Minna trong Lộ trình để xem từ vựng riêng, flashcard, luyện viết và trắc nghiệm cuối bài.')+card('<div class="row"><label for="topic">Chủ đề:</label><select id="topic" class="field">'+Object.keys(groups).map(t=>'<option '+(topic===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select><label><input id="romaji" type="checkbox" '+(showRomaji?'checked':'')+'> Hiện Romaji</label></div><p class="small muted">Lưu ý: tuổi, ngày, tháng, phút và lượng từ có cách đọc biến âm riêng.</p>'+wordlist(groups[topic]))};
function grammarPage(){return head('Ngữ pháp Minna no Nihongo I · Bài 1–25','Danh sách bài học đi theo thứ tự giáo trình; mở từng bài trong mục Lộ trình để học mẫu câu tương ứng. Các giải thích và ví dụ là nội dung tự biên soạn.')+card('<p class="note">Học theo tiến trình: danh từ và chỉ định từ → động từ lịch sự → tính từ → thể て／ない／từ điển／た → thể thông thường và mệnh đề.</p>')+card(grammar.map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+esc(g[0])+' — '+esc(g[1])+'</summary><p class="jp">'+esc(g[2])+'</p><p class="roma">'+esc(g[3])+'</p><p>'+esc(g[4])+'</p><p class="note">'+esc(g[5])+'</p>'+btn('🔊 Nghe ví dụ','say',g[2])+'</details>').join(''))};
function kanjiPage(){return head('Học bộ thủ trước → rồi mới học Kanji','Bước 1: nhận diện bộ thủ và ý nghĩa gợi ý. Bước 2: quan sát Kanji có chứa bộ đó. Bước 3: học âm On/Kun và từ ghép. Bộ thủ chỉ gợi ý nhóm nghĩa, không luôn quyết định toàn bộ nghĩa/cách đọc.')+card('<h3>🌱 BƯỚC 1 · 10 bộ thủ nền tảng</h3>'+radicals.map((r,i)=>'<details '+(i===0?'open':'')+'><summary><span class="jp">'+esc(r[0])+'</span> · '+esc(r[1])+' — '+esc(r[2])+'</summary><p><b>Ví dụ nhận diện:</b> '+esc(r[3])+'</p><p class="small muted">Hãy quan sát hình dạng bộ thủ trong chữ ghép và ghi nhớ ý nghĩa gợi ý.</p><button class="btn" data-act="say" data-val="'+esc(r[1])+'">🔊 Nghe tên bộ</button></details>').join(''))+card('<h3>🈶 BƯỚC 2 · Kanji nhập môn</h3>'+kanji.map(k=>'<details><summary><span class="jp">'+esc(k[0])+'</span> · '+esc(k[3])+'</summary><p>Âm On: '+esc(k[1])+'<br>Âm Kun: '+esc(k[2])+'<br>Ví dụ: '+esc(k[4])+'</p><button class="btn" data-act="say" data-val="'+esc(k[4].split('（')[1]?.replace('）','')||k[0])+'">🔊 Nghe ví dụ</button></details>').join(''))+card('<div class="note"><b>Thứ tự học Kanji của bà:</b> bộ thủ → cấu tạo chữ → nghĩa cơ bản → âm On/Kun → từ ghép → luyện viết theo thứ tự nét. Không học thuộc âm đọc rời rạc khi chưa có từ ví dụ.</div>')};
let deck=Object.values(groups).flat();function flash(){let w=deck[flashIndex%deck.length];return head('Flashcard từ vựng 🎴','Chạm thẻ để lật, đánh dấu từ đã thuộc.')+card('<p class="small muted">'+(flashIndex+1)+' / '+deck.length+'</p><button class="flash" data-act="flip"><div class="small">'+(flipped?'NGHĨA':'TIẾNG NHẬT')+'</div><div class="jp">'+esc(flipped?w[3]:w[0])+'</div><p>'+(flipped?esc(w[1])+' · '+esc(w[2]):'Chạm để xem nghĩa')+'</p></button><div class="row" style="margin-top:14px">'+btn('← Trước','prev')+btn('Tiếp →','next','', 'btn primary')+btn('🔊 Nghe','say',w[1])+btn(state.known.includes(w[0])?'✓ Đã thuộc':'♡ Đánh dấu thuộc','known')+'</div>')};
const listening=[['こんにちは','konnichiwa','Xin chào'],['ありがとうございます','arigatō gozaimasu','Cảm ơn'],['わたしは 学生です。','watashi wa gakusei desu','Tôi là sinh viên'],['いま 何時ですか。','ima nanji desu ka','Bây giờ là mấy giờ?'],['水を 飲みます。','mizu o nomimasu','Tôi uống nước']];
function listen(){return head('Nghe · Đọc · Phát âm','Nghe tiếng Nhật, đọc Romaji, nhắc lại rồi tự kiểm tra.')+card(listening.map(x=>'<div class="word"><div class="grow"><div class="jp">'+esc(x[0])+'</div><div class="roma">'+esc(x[1])+'</div><div class="small">'+esc(x[2])+'</div></div>'+btn('▶ Nghe','say',x[0])+'</div>').join(''))+card('<h3>🎙 Luyện nói</h3><p class="small muted">Bấm micro và nói câu tiếng Nhật. Kết quả chỉ là nhận dạng lời nói, không phải điểm đánh giá phát âm chuẩn.</p>'+btn('Bắt đầu nói','mic')+'<p id="mic-result" aria-live="polite"></p>')+card('<h3>📖 Đọc hiểu ngắn</h3><p class="jp">わたしは マイです。ベトナムじんです。がくせいです。</p><p class="roma">watashi wa Mai desu. Betonamu-jin desu. gakusei desu.</p>'+btn('Xem dịch nghĩa','translation')+'<p id="translation"></p>')};
function quizPage(){if(qComplete){let score=qAnswers.filter((v,i)=>v===quiz[i][2]).length;return head('Kết quả luyện JLPT N5','Bài tự biên soạn, không phải đề thi JLPT chính thức')+card('<h2>🌸 '+score+'/'+quiz.length+' câu đúng</h2><p>'+Math.round(score/quiz.length*100)+'% · Xem giải thích từng câu bên dưới.</p>'+btn('Làm lại','resetquiz','', 'btn primary'))+quiz.map((q,i)=>card('<b>Câu '+(i+1)+': '+esc(q[0])+'</b><p>'+(qAnswers[i]===q[2]?'✅':'❌')+' Đáp án: '+esc(q[1][q[2]])+'</p><p class="small muted">'+esc(q[3])+'</p>')).join('')};let q=quiz[qIndex];return head('Luyện JLPT N5 🏆','Bộ câu hỏi tự biên soạn · Có đáp án và giải thích chi tiết')+card('<div class="row"><b>Câu '+(qIndex+1)+'/'+quiz.length+'</b></div>'+progress(qIndex,quiz.length)+'<h3 style="margin-top:16px">'+esc(q[0])+'</h3>'+q[1].map((a,i)=>btn(String.fromCharCode(65+i)+'. '+esc(a),'answer',i,'answer '+(chosen===i?(i===q[2]?'correct':'incorrect'):''))).join('')+(chosen===null?'<p class="small muted">Chọn đáp án để xem lời giải.</p>':'<p class="note">'+(chosen===q[2]?'✅ Chính xác. ':'❌ Chưa đúng. ')+esc(q[3])+'</p>'+btn(qIndex===quiz.length-1?'Xem kết quả':'Câu tiếp →','nextq','', 'btn primary')))};
function schedule(){let tasks=['Học 5 chữ cái','Học 5 từ vựng','Ôn ngữ pháp','Nghe và nói 5 phút','Làm 5 câu quiz'];return head('Lịch học mỗi ngày 📅','Gợi ý 20–30 phút/ngày, ôn lại bài cũ trước khi học mới.')+card('<h3>Hôm nay · '+today()+'</h3>'+tasks.map((t,i)=>'<label class="word"><span>'+t+'</span><input class="check" type="checkbox" data-task="'+(i+10)+'" '+(state.tasks[today()+'-'+(i+10)]?'checked':'')+'></label>').join(''))+card('<h3>Tuần nhập môn đầu tiên</h3>'+['Ngày 1: あいうえお','Ngày 2: Hiragana hàng K và S','Ngày 3: Hiragana hàng T và N','Ngày 4: Hiragana hàng H và M','Ngày 5: Hiragana hàng Y, R, W','Ngày 6: Số 0–10 và chào hỏi','Ngày 7: Ôn và làm quiz'].map(t=>'<p>🌸 '+t+'</p>').join(''))};
function progressPage(){return head('Tiến độ của tui 📊','Dữ liệu lưu trên trình duyệt đang dùng, không đồng bộ giữa thiết bị.')+card('<h3>Chủ đề đã học</h3>'+progress(state.done.length,lessons.length)+'<p>'+state.done.length+'/'+lessons.length+' bài · '+state.known.length+' từ đã thuộc</p>')+card('<h3>Lịch sử kiểm tra</h3>'+(state.scores.length?state.scores.map((s,i)=>'<p>Lần '+(i+1)+': '+s+'%</p>').join(''):'Chưa có bài kiểm tra nào.')+'<div class="row">'+btn('Xuất bản sao tiến độ (.json)','export')+btn('Nhập bản sao','import')+'</div><input type="file" id="backup" accept="application/json,.json" hidden><p class="small muted">File sao lưu nằm trên thiết bị của bạn. Không nhập file từ nguồn không tin cậy.</p>')};
const renderers={home,road,lesson,kana:kanaPage,vocab,grammar:grammarPage,kanji:kanjiPage,flash,listen,quiz:quizPage,schedule,progress:progressPage};
function render(){el('nav').innerHTML=sections.map(x=>btn(x[1],'page',x[0],'btn '+(page===x[0]?'active':''))).join('');el('main').innerHTML=renderers[page]();stats()};
document.addEventListener('change',e=>{if(e.target.id==='topic'){topic=e.target.value;render()}if(e.target.id==='romaji'){showRomaji=e.target.checked;render()}if(e.target.dataset.task!==undefined){state.tasks[today()+'-'+e.target.dataset.task]=e.target.checked;day();persist()}if(e.target.id==='backup'&&e.target.files[0]){const f=e.target.files[0];if(f.size>100000){alert('File quá lớn.');return}let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.done)||!Array.isArray(obj.known)||!Array.isArray(obj.days)||!Array.isArray(obj.scores)||!obj.tasks||typeof obj.tasks!=='object')throw Error();state={done:obj.done.filter(x=>Number.isInteger(x)&&x>=0&&x<lessons.length).slice(0,lessons.length),known:obj.known.filter(x=>typeof x==='string'&&x.length<100).slice(0,1000),days:obj.days.filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)).slice(0,2000),scores:obj.scores.filter(x=>typeof x==='number'&&x>=0&&x<=100).slice(0,1000),tasks:Object.fromEntries(Object.entries(obj.tasks).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}-\d{1,2}$/.test(k)&&typeof v==='boolean').slice(0,10000))};persist();render();alert('Đã khôi phục tiến độ.')}catch(_){alert('File sao lưu không hợp lệ.')}};reader.readAsText(f)}});
document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.val;if(a==='page'){page=v;render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='openlesson'){lessonIndex=Number(v);page='lesson';reviewIndex=0;reviewFlipped=false;grammarFlipped=false;writeIndex=0;render()}else if(a==='complete'){let n=Number(v);if(!state.done.includes(n))state.done.push(n);day();persist();render()}else if(a==='script'){script=v;render()}else if(a==='say')say(v);else if(a==='flip'){flipped=!flipped;render()}else if(a==='prev'||a==='next'){flashIndex=(flashIndex+(a==='next'?1:-1)+deck.length)%deck.length;flipped=false;render()}else if(a==='known'){let w=deck[flashIndex][0];state.known=state.known.includes(w)?state.known.filter(x=>x!==w):[...state.known,w];day();persist();render()}else if(a==='answer'){if(chosen!==null)return;chosen=Number(v);render()}else if(a==='nextq'){qAnswers[qIndex]=chosen;chosen=null;if(qIndex===quiz.length-1){qComplete=true;state.scores.push(Math.round(qAnswers.filter((x,i)=>x===quiz[i][2]).length/quiz.length*100));day();persist()}else qIndex++;render()}else if(a==='resetquiz'){qIndex=0;chosen=null;qAnswers=[];qComplete=false;render()}else if(a==='translation'){el('translation').textContent='Tôi là Mai. Tôi là người Việt Nam. Tôi là sinh viên.'}else if(a==='mic'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){el('mic-result').textContent='Trình duyệt không hỗ trợ nhận dạng giọng nói.';return}try{let r=new R();r.lang='ja-JP';r.onresult=x=>{el('mic-result').textContent='Máy nghe được: '+x.results[0][0].transcript};r.onerror=()=>{el('mic-result').textContent='Không nhận dạng được. Thử lại nhé.'};r.start();el('mic-result').textContent='Đang nghe...'}catch(_){el('mic-result').textContent='Không thể mở micro.'}}else if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nihongo-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='reviewflip'){reviewFlipped=!reviewFlipped;render()}else if(a==='reviewprev'||a==='reviewnext'){let k=lessonIndex-24,arr=minnaVocab[k];reviewIndex=(reviewIndex+(a==='reviewnext'?1:-1)+arr.length)%arr.length;reviewFlipped=false;render()}else if(a==='reviewknown'){let parts=String(v).split(':'),k=Number(parts[0]),wi=Number(parts[1]),w=minnaVocab[k][wi][0];if(!state.known.includes(w))state.known.push(w);day();persist();reviewIndex=(reviewIndex+1)%minnaVocab[k].length;reviewFlipped=false;render()}else if(a==='gramflip'){grammarFlipped=!grammarFlipped;render()}else if(a==='writenext'){let k=Number(v);writeIndex=(writeIndex+1)%minnaVocab[k].length;render()}else if(a==='checkwrite'){let k=Number(v),w=minnaVocab[k][writeIndex%minnaVocab[k].length],val=(el('write-answer')?.value||'').trim().replace(/\s/g,'');let target=w[0].replace(/\s/g,'');let fb=el('write-feedback');if(fb)fb.textContent=val===target?'✅ Chính xác! Bà đã viết đúng.':'Chưa khớp. Đáp án: '+w[0]+' · '+w[1]+' · '+w[2];}else if(a==='lessonanswer'){let [k,j,i]=String(v).split(':').map(Number),opts=lessonQuizOptions(k,j),right=j<5?0:opts.indexOf(minnaLessons[k][6]),fb=el('lesson-qfb-'+j),words=minnaVocab[k],w=j<5?words[[0,2,4,6,8][j]]:null;if(fb)fb.textContent=i===right?(j<5?'✅ Đúng rồi! '+w[0]+' nghĩa là '+w[3]+'.':'✅ Chính xác! Công thức trọng tâm là '+minnaLessons[k][6]):(j<5?'❌ Chưa đúng. Đáp án là '+w[3]+'. '+w[0]+'（'+w[1]+'）.':'❌ Chưa đúng. Công thức đúng: '+minnaLessons[k][6]+'.');b.disabled=true;}else if(a==='import')el('backup').click()});
render();
</script></body></html>
